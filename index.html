<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maze Solving Robot Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        #maze-container {
            display: grid;
            grid-template-columns: repeat(7, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 2px;
            margin-bottom: 30px;
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            background-color: rgb(233, 242, 252);
            border: 1px solid #ddd;
            position: relative;
        }
        .wall {
            background-color: #2c3e50;
            color: white;
        }
        .robot {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #3498db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            z-index: 10;
            transition: all 0.5s ease;
        }
        .visited {
            background-color: #b8d4f5;
        }
        .path {
            background-color: #2ecc71;
        }
        .start {
            background-color: #2ecc71;
        }
        .goal {
            background-color: #e74c3c;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .results {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 560px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }
        .highlight {
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.8);
        }
    </style>
</head>
<body>
    <h1>Maze Solving Robot Visualization</h1>
    
    <div class="controls">
        <button id="bfs-btn">BFS Algorithm</button>
        <button id="dfs-btn">DFS Algorithm</button>
        <button id="astar-btn">A* Algorithm</button>
        <button id="reset-btn">Reset</button>
    </div>
    
    <div id="maze-container"></div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background-color: #2ecc71;"></div>
            <span>Start (A)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #e74c3c;"></div>
            <span>Goal (B)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #3498db; border-radius: 50%;"></div>
            <span>Robot</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #b8d4f5;"></div>
            <span>Visited</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #2ecc71;"></div>
            <span>Solution Path</span>
        </div>
    </div>
    
    <div class="results" id="results">
        <h3>Results:</h3>
        <p><strong>Algorithm:</strong> <span id="algorithm-name">Not started</span></p>
        <p><strong>Nodes Explored:</strong> <span id="nodes-explored">0</span></p>
        <p><strong>Solution Path:</strong> <span id="solution-path">None</span></p>
        <p><strong>Path Length:</strong> <span id="path-length">0</span> steps</p>
    </div>
    
    <script>
        // Define the maze grid structure
        // Each cell is [row, column, id, isWall]
        const mazeGrid = [
            [0, 0, null, true], [0, 1, null, true], [0, 2, '10', false], [0, 3, '12', false], [0, 4, '13', false], [0, 5, null, true], [0, 6, null, true],
            [1, 0, null, true], [1, 1, '6', false], [1, 2, '5', false], [1, 3, '7', false], [1, 4, '14', false], [1, 5, '17', false], [1, 6, null, true],
            [2, 0, null, true], [2, 1, '3', false], [2, 2, '2', false], [2, 3, '4', false], [2, 4, null, true], [2, 5, '20', false], [2, 6, '21', false],
            [3, 0, 'A', false], [3, 1, '1', false], [3, 2, null, true], [3, 3, '15', false], [3, 4, '16', false], [3, 5, null, true], [3, 6, 'B', false]
        ];

        // Define the maze connections (adjacency list)
        const connections = {
            'A': ['1'],
            '1': ['A', '15'],
            '2': ['3', '4', '5'],
            '3': ['2', '6'],
            '4': ['2'],
            '5': ['2', '6', '7'],
            '6': ['3', '5'],
            '7': ['5', '14'],
            '10': ['12'],
            '12': ['10', '13'],
            '13': ['12'],
            '14': ['7', '17'],
            '15': ['1', '16'],
            '16': ['15', '20'],
            '17': ['14', '20'],
            '20': ['16', '17', '21'],
            '21': ['20', 'B'],
            'B': ['21']
        };

        // Define the heuristic values for A* algorithm
        const heuristics = {
            'A': 8,
            '1': 6,
            '2': 6,
            '3': 6,
            '4': 7,
            '5': 4,
            '6': 12,
            '7': 7,
            '10': 6,
            '12': 6,
            '13': 5,
            '14': 4,
            '15': 8,
            '16': 6,
            '17': 3,
            '20': 2,
            '21': 1,
            'B': 0
        };

        // Track cell positions by ID for robot movement
        const cellPositions = {};

        // Create the maze grid
        const mazeContainer = document.getElementById('maze-container');
        
        for (const cell of mazeGrid) {
            const [row, col, id, isWall] = cell;
            const cellElement = document.createElement('div');
            cellElement.className = 'cell';
            
            if (isWall) {
                cellElement.classList.add('wall');
            } else {
                cellElement.textContent = id;
                cellElement.id = `cell-${id}`;
                
                // Store position for robot movement
                cellPositions[id] = { row, col };
                
                if (id === 'A') {
                    cellElement.classList.add('start');
                } else if (id === 'B') {
                    cellElement.classList.add('goal');
                }
            }
            
            mazeContainer.appendChild(cellElement);
        }

        // Create the robot
        const robot = document.createElement('div');
        robot.className = 'robot';
        robot.id = 'robot';
        robot.textContent = 'R';
        
        // Add robot to start cell
        const startCell = document.getElementById('cell-A');
        startCell.appendChild(robot);

        // Algorithm implementations
        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Reset the maze
        function resetMaze() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.classList.remove('visited', 'path', 'highlight');
                if (cell.id === 'cell-A') {
                    cell.classList.add('start');
                    // Move robot back to start
                    if (!cell.contains(robot)) {
                        cell.appendChild(robot);
                    }
                } else if (cell.id === 'cell-B') {
                    cell.classList.add('goal');
                }
            });
            
            document.getElementById('algorithm-name').textContent = 'Not started';
            document.getElementById('nodes-explored').textContent = '0';
            document.getElementById('solution-path').textContent = 'None';
            document.getElementById('path-length').textContent = '0';
        }

        // Move the robot to a cell
        async function moveRobot(cellId) {
            const cell = document.getElementById(`cell-${cellId}`);
            if (cell) {
                cell.appendChild(robot);
                cell.classList.add('highlight');
                await delay(300); // Delay to see the movement
                cell.classList.remove('highlight');
            }
        }

        // Mark a cell as visited
        function markVisited(cellId) {
            const cell = document.getElementById(`cell-${cellId}`);
            if (cell && !cell.classList.contains('start') && !cell.classList.contains('goal')) {
                cell.classList.add('visited');
            }
        }

        // Mark a cell as part of the path
        function markPath(cellId) {
            const cell = document.getElementById(`cell-${cellId}`);
            if (cell && !cell.classList.contains('start')) {
                cell.classList.add('path');
            }
        }

        // BFS Algorithm
        async function runBFS() {
            resetMaze();
            document.getElementById('algorithm-name').textContent = 'Breadth-First Search';
            
            const startNode = 'A';
            const goalNode = 'B';
            
            const queue = [{ node: startNode, path: [startNode] }];
            const visited = new Set([startNode]);
            
            while (queue.length > 0) {
                const { node, path } = queue.shift();
                
                await moveRobot(node);
                markVisited(node);
                
                if (node === goalNode) {
                    // Found the goal
                    for (const pathNode of path) {
                        markPath(pathNode);
                        await delay(100);
                    }
                    
                    document.getElementById('nodes-explored').textContent = visited.size;
                    document.getElementById('solution-path').textContent = path.join(' → ');
                    document.getElementById('path-length').textContent = path.length - 1;
                    return;
                }
                
                for (const neighbor of (connections[node] || [])) {
                    if (!visited.has(neighbor)) {
                        visited.add(neighbor);
                        queue.push({ node: neighbor, path: [...path, neighbor] });
                    }
                }
            }
            
            document.getElementById('solution-path').textContent = 'No path found';
        }

        // DFS Algorithm
        async function runDFS() {
            resetMaze();
            document.getElementById('algorithm-name').textContent = 'Depth-First Search';
            
            const startNode = 'A';
            const goalNode = 'B';
            
            const stack = [{ node: startNode, path: [startNode] }];
            const visited = new Set([startNode]);
            
            while (stack.length > 0) {
                const { node, path } = stack.pop();
                
                await moveRobot(node);
                markVisited(node);
                
                if (node === goalNode) {
                    // Found the goal
                    for (const pathNode of path) {
                        markPath(pathNode);
                        await delay(100);
                    }
                    
                    document.getElementById('nodes-explored').textContent = visited.size;
                    document.getElementById('solution-path').textContent = path.join(' → ');
                    document.getElementById('path-length').textContent = path.length - 1;
                    return;
                }
                
                // Reverse neighbors for more natural DFS
                const neighbors = [...(connections[node] || [])].reverse();
                
                for (const neighbor of neighbors) {
                    if (!visited.has(neighbor)) {
                        visited.add(neighbor);
                        stack.push({ node: neighbor, path: [...path, neighbor] });
                    }
                }
            }
            
            document.getElementById('solution-path').textContent = 'No path found';
        }

        // A* Algorithm
        async function runAStar() {
            resetMaze();
            document.getElementById('algorithm-name').textContent = 'A* Algorithm';
            
            const startNode = 'A';
            const goalNode = 'B';
            
            // Priority queue for A*
            const openSet = [{ node: startNode, gScore: 0, fScore: heuristics[startNode], path: [startNode] }];
            const closedSet = new Set();
            
            while (openSet.length > 0) {
                // Sort by fScore to get the node with the lowest value
                openSet.sort((a, b) => a.fScore - b.fScore);
                
                const current = openSet.shift();
                const { node, gScore, path } = current;
                
                if (closedSet.has(node)) continue;
                
                await moveRobot(node);
                markVisited(node);
                closedSet.add(node);
                
                if (node === goalNode) {
                    // Found the goal
                    for (const pathNode of path) {
                        markPath(pathNode);
                        await delay(100);
                    }
                    
                    document.getElementById('nodes-explored').textContent = closedSet.size;
                    document.getElementById('solution-path').textContent = path.join(' → ');
                    document.getElementById('path-length').textContent = path.length - 1;
                    return;
                }
                
                for (const neighbor of (connections[node] || [])) {
                    if (closedSet.has(neighbor)) continue;
                    
                    // Assume cost of 1 for each move
                    const tentativeGScore = gScore + 1;
                    const tentativeFScore = tentativeGScore + heuristics[neighbor];
                    
                    openSet.push({
                        node: neighbor,
                        gScore: tentativeGScore,
                        fScore: tentativeFScore,
                        path: [...path, neighbor]
                    });
                }
            }
            
            document.getElementById('solution-path').textContent = 'No path found';
        }

        // Set up event listeners
        document.getElementById('bfs-btn').addEventListener('click', runBFS);
        document.getElementById('dfs-btn').addEventListener('click', runDFS);
        document.getElementById('astar-btn').addEventListener('click', runAStar);
        document.getElementById('reset-btn').addEventListener('click', resetMaze);
    </script>
</body>
</html>
